name: Generate Arcade Animation

on:
    schedule:
        - cron: "0 3 * * *"
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
    generate:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        permissions:
            contents: write

        steps:
            - name: Generate Galaga contribution animations
              uses: abozanona/pacman-contribution-graph@main
              with:
                  github_user_name: ${{ github.repository_owner }}
                  games: galaga
                  hide_month_labels: "true"

            - name: Publish animations
              uses: crazy-max/ghaction-github-pages@v3.1.0
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
